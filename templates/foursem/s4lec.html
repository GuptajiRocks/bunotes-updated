<!doctype html>
<html>
    <head>
        <title>{{ title }}</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <style>
            * {
                box-sizing: border-box;
                font-family: "Segoe UI", system-ui, sans-serif;
            }

            body {
                margin: 0;
                background: #f4f6fb;
                color: #1f2933;
            }

            .page {
                max-width: 1100px;
                margin: auto;
                padding: 2.5rem 1.5rem;
            }

            h2 {
                text-align: center;
                margin-bottom: 0.5rem;
            }

            .nav {
                text-align: center;
                margin-bottom: 1.8rem;
            }

            .nav a {
                color: #2563eb;
                text-decoration: none;
                font-weight: 500;
            }

            .nav a:hover {
                text-decoration: underline;
            }

            /* TABLE */
            .table-wrap {
                overflow-x: auto;
            }

            table {
                width: 100%;
                border-collapse: collapse;
                background: white;
                border-radius: 12px;
                overflow: hidden;
                box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            }

            th,
            td {
                padding: 14px 16px;
                text-align: left;
            }

            th {
                background: #2563eb;
                color: white;
                font-weight: 600;
            }

            tr:not(:last-child) td {
                border-bottom: 1px solid #e5e7eb;
            }

            tbody tr:hover {
                background: #f9fafb;
            }

            td:first-child {
                width: 70px;
                text-align: center;
            }

            td:last-child {
                width: 100px;
                text-align: center;
            }

            a {
                text-decoration: none;
                color: #2563eb;
                font-weight: 500;
            }

            a:hover {
                text-decoration: underline;
            }

            /* MOBILE */
            @media (max-width: 700px) {
                th,
                td {
                    padding: 12px;
                    font-size: 0.9rem;
                }
            }
        </style>
    </head>

    <body>
        <div class="page">
            <h2>{{ name }} Lectures</h2>

            <div class="nav">
                <a href="/semfour">Sem-4</a>
            </div>

            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>S.No</th>
                            <th>File Name</th>
                            <th>Open</th>
                        </tr>
                    </thead>

                    <tbody>
                        {% for link in data %} {% set filename =
                        link.split('/')[-1].replace('%20',' ') %}
                        <tr>
                            <td>{{ loop.index }}</td>
                            <td>{{ filename }}</td>
                            <td>
                                <a href="{{ link }}" target="_blank">View</a>
                            </td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </body>
</html>
