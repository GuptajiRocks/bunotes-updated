<!doctype html>
<html>
    <head>
        <title>{{ title }}</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <style>
            table {
                width: 100%;
                border-collapse: collapse;
            }
            th,
            td {
                padding: 10px;
                border: 1px solid #ddd;
                text-align: left;
            }
            th {
                background: #f3f3f3;
            }
            a {
                text-decoration: none;
                color: #2563eb;
            }
            h2 {
                text-align: center;
            }
        </style>
    </head>
    <body>
        <h2>{{ name }} Lectures</h2>
        <a href="/semfour">Sem-4</a>

        <table>
            <thead>
                <tr>
                    <th>S.No</th>
                    <th>File Name</th>
                    <th>Open</th>
                </tr>
            </thead>

            <tbody>
                {% for link in data %} {% set filename =
                link.split('/')[-1].replace('%20',' ') %}
                <tr>
                    <td>{{ loop.index }}</td>
                    <td>{{ filename }}</td>
                    <td>
                        <a href="{{ link }}" target="_blank">View</a>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </body>
</html>
